name: Build & push companion image

# Builds the companion Docker image for amd64 + arm64 and pushes to Docker Hub.
# Requires repo secrets DOCKERHUB_USERNAME (e.g. kars85) and DOCKERHUB_TOKEN (a Docker Hub access
# token with read/write on the repo). Nothing is pushed without them.
#
# Triggers:
#   - workflow_dispatch: publishes the explicit `tag` input (default "edge"). `:latest` is ONLY moved
#     when dispatched from `master`, so a build from a feature branch can't clobber everyone's latest.
#   - push of a `companion-v*` tag: publishes that tag AND `:latest`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.0). ':latest' only updates from master or a companion-v* tag."
        required: true
        default: "edge"
  push:
    tags:
      - "companion-v*"

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/opensprinkler-companion
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'master') }}

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
